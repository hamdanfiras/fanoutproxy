server:
  port: ${SERVER_PORT:8080}

spring:
  application:
    name: fanoutproxy
  datasource:
    url: ${DB_URL:jdbc:oracle:thin:@localhost:1521/FREEPDB1}
    username: ${DB_USERNAME:fanout}
    password: ${DB_PASSWORD:fanout}
    driver-class-name: oracle.jdbc.OracleDriver
  jpa:
    hibernate:
      ddl-auto: validate
    open-in-view: false
    properties:
      hibernate:
        dialect: org.hibernate.dialect.OracleDialect
  flyway:
    enabled: true

management:
  endpoints:
    web:
      exposure:
        include: health,info,metrics
  endpoint:
    health:
      probes:
        enabled: true

camel:
  springboot:
    name: fanoutproxy

fanout:
  default-timeout-ms: 60000
