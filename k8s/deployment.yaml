apiVersion: apps/v1
kind: Deployment
metadata:
  name: fanoutproxy
  labels:
    app: fanoutproxy
spec:
  replicas: 1
  selector:
    matchLabels:
      app: fanoutproxy
  template:
    metadata:
      labels:
        app: fanoutproxy
    spec:
      containers:
        - name: fanoutproxy
          image: fanoutproxy:latest
          imagePullPolicy: IfNotPresent
          ports:
            - containerPort: 8080
              name: http
          env:
            - name: DB_URL
              valueFrom:
                secretKeyRef:
                  name: fanoutproxy-db
                  key: url
            - name: DB_USERNAME
              valueFrom:
                secretKeyRef:
                  name: fanoutproxy-db
                  key: username
            - name: DB_PASSWORD
              valueFrom:
                secretKeyRef:
                  name: fanoutproxy-db
                  key: password
            - name: FANOUT_PROXY_PREFIX
              value: /proxy
          readinessProbe:
            httpGet:
              path: /actuator/health/readiness
              port: http
            initialDelaySeconds: 15
            periodSeconds: 10
          livenessProbe:
            httpGet:
              path: /actuator/health/liveness
              port: http
            initialDelaySeconds: 30
            periodSeconds: 20
---
apiVersion: v1
kind: Service
metadata:
  name: fanoutproxy
  labels:
    app: fanoutproxy
spec:
  selector:
    app: fanoutproxy
  ports:
    - name: http
      port: 8080
      targetPort: http
---
apiVersion: route.openshift.io/v1
kind: Route
metadata:
  name: fanoutproxy
  labels:
    app: fanoutproxy
spec:
  to:
    kind: Service
    name: fanoutproxy
  port:
    targetPort: http
